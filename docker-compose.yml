services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sgrowing_postgres
    restart: always
    environment:
      POSTGRES_USER: sgrowing_user
      POSTGRES_PASSWORD: sgrowing_password
      POSTGRES_DB: sgrowing_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgrowing_user -d sgrowing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sgrowing_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: src/backend/SGrowing.Api/Dockerfile
    container_name: sgrowing_api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sgrowing_db;Username=sgrowing_user;Password=sgrowing_password
      - Redis__ConnectionString=redis:6379
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: src/backend/SGrowing.Worker/Dockerfile
    container_name: sgrowing_worker
    restart: always
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sgrowing_db;Username=sgrowing_user;Password=sgrowing_password
      - Redis__ConnectionString=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: src/frontend
      dockerfile: Dockerfile
    container_name: sgrowing_web
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - api

  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: sgrowing_evolution_wa
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=sgrowing_super_secret_wa_key
      - DATABASE_ENABLED=false

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: sgrowing_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=sgrowing_admin
      - MINIO_ROOT_PASSWORD=sgrowing_secret_s3_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
