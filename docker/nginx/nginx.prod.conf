# ==============================================================================
# SGrowing Enterprise Nginx 1.27 Production Web Server
# Includes: Security Headers (HSTS, CSP, X-Frame-Options), Static Caching & Proxy
# ==============================================================================

upstream sgrowing_backend {
    server sgrowing-api:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream sgrowing_mcp_backend {
    server sgrowing-mcp:7890 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # 1. Enterprise Security Headers (PRD Section 4.2 & OWASP Top 10)
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none';" always;

    # --------------------------------------------------------------------------
    # 2. High-Performance Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 3. Health Check Probe for Orchestrator (Docker / Kubernetes / Swarm)
    # --------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --------------------------------------------------------------------------
    # 4. Long-Lived Static Asset Caching (Vite/Angular Bundled Hashes)
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 5. Angular SPA HTML (Never Cache index.html)
    # --------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 6. Reverse Proxy: .NET 10 REST & Minimal APIs
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://sgrowing_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # --------------------------------------------------------------------------
    # 7. Reverse Proxy: SignalR Real-Time Full-Duplex WebSockets
    # --------------------------------------------------------------------------
    location /hubs/ {
        proxy_pass http://sgrowing_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # 8. Reverse Proxy: Enterprise Model Context Protocol (MCP) Server
    # --------------------------------------------------------------------------
    location /mcp {
        proxy_pass http://sgrowing_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Backend Health Check Passthrough
    location /health {
        proxy_pass http://sgrowing_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
