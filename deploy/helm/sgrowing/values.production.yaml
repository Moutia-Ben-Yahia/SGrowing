# ==============================================================================
# SGrowing Enterprise Growth OS - High-Availability Production Overrides
# ==============================================================================

replicaCount: 3

worker:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "sgrowing-api"
    nginx.org/websocket-services: "sgrowing-api"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  hosts:
    - host: api.sgrowing.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sgrowing-api-tls
      hosts:
        - api.sgrowing.io

config:
  aspnetcoreEnvironment: Production
  logLevel: Information
  allowedHosts: "api.sgrowing.io"
