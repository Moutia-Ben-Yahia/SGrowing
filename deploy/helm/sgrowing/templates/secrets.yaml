apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sgrowing.fullname" . }}-secret
  labels:
    {{- include "sgrowing.labels" . | nindent 4 }}
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: {{ printf "Host=%s;Port=%d;Database=%s;Username=%s;Password=%s;SSL Mode=%s;" .Values.postgresql.host (int .Values.postgresql.port) .Values.postgresql.database .Values.postgresql.username .Values.postgresql.password .Values.postgresql.sslMode | quote }}
  Redis__ConnectionString: {{ if .Values.redis.password }}{{ printf "%s:%d,password=%s,abortConnect=false" .Values.redis.host (int .Values.redis.port) .Values.redis.password | quote }}{{ else }}{{ printf "%s:%d,abortConnect=false" .Values.redis.host (int .Values.redis.port) | quote }}{{ end }}
  Jwt__Key: {{ .Values.secrets.jwtSecretKey | quote }}
  Jwt__Issuer: {{ .Values.secrets.jwtIssuer | quote }}
  Jwt__Audience: {{ .Values.secrets.jwtAudience | quote }}
  Webhook__SigningSecret: {{ .Values.secrets.webhookSigningSecret | quote }}
