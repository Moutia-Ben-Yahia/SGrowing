apiVersion: v1
kind: Service
metadata:
  name: {{ include "sgrowing.fullname" . }}-api
  labels:
    {{- include "sgrowing.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
    {{- if .Values.otelCollector.enabled }}
    - port: 4317
      targetPort: 4317
      protocol: TCP
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      protocol: TCP
      name: otlp-http
    {{- end }}
  selector:
    {{- include "sgrowing.selectorLabels" . | nindent 4 }}
