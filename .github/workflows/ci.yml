name: SGrowing Continuous Integration & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: .NET 10 Backend Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore SGrowing.slnx

      - name: Build Solution
        run: dotnet build SGrowing.slnx --no-restore --configuration Release

      - name: Run Test Suite
        run: dotnet test SGrowing.slnx --no-build --configuration Release --verbosity normal

  frontend-build:
    name: Angular 21 Frontend Build & Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build Angular Web App
        working-directory: src/frontend
        run: npm run build

      - name: Run Frontend Tests
        working-directory: src/frontend
        run: npm test -- --watch=false
