name: SGrowing Continuous Integration & Enterprise Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: .NET 10 Backend Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore SGrowing.slnx

      - name: Build Solution
        run: dotnet build SGrowing.slnx --no-restore --configuration Release

      - name: Run Test Suite
        run: dotnet test SGrowing.slnx --no-build --configuration Release --verbosity normal

  frontend-e2e:
    name: Angular 22 Frontend, Vitest & Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci --legacy-peer-deps

      - name: Build Angular Web App
        working-directory: src/frontend
        run: npm run build

      - name: Run Unit Tests (Vitest)
        working-directory: src/frontend
        run: npm test -- --watch=false

      - name: Install Playwright Browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: src/frontend
        run: npx playwright test

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

  docker-build:
    name: Docker Container Image Builds
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-e2e]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend API Docker Image
        run: docker build -t sgrowing-api:latest -f src/backend/SGrowing.Api/Dockerfile .

      - name: Build Backend Worker Docker Image
        run: docker build -t sgrowing-worker:latest -f src/backend/SGrowing.Worker/Dockerfile .

      - name: Build Backend MCP Server Docker Image
        run: docker build -t sgrowing-mcpserver:latest -f src/backend/SGrowing.McpServer/Dockerfile .

      - name: Build Frontend Web Docker Image
        run: docker build -t sgrowing-web:latest src/frontend
