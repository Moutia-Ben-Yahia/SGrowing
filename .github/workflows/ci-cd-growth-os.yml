name: SGrowing Enterprise Growth OS CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verification:
    name: Backend Build & Test Matrix (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore SGrowing.slnx

      - name: Build Backend (TreatWarningsAsErrors = true)
        run: dotnet build SGrowing.slnx -c Release

      - name: Execute Full Test Suite (5,809+ Tests)
        run: dotnet test tests/SGrowing.Tests/SGrowing.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx"

  frontend-verification:
    name: Frontend Build & Unit Suite (Node 22 / Angular 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Vitest Suite (1,279+ Tests)
        run: npm test -- --run

      - name: Build Production Bundle (ng build)
        run: npm run build

  container-packaging:
    name: Self-Hosted Docker Container Packaging
    runs-on: ubuntu-latest
    needs: [backend-verification, frontend-verification]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend API Dockerfile
        run: docker build -f src/backend/SGrowing.Api/Dockerfile . --target build

      - name: Validate Worker Daemon Dockerfile
        run: docker build -f src/backend/SGrowing.Worker/Dockerfile . --target build

      - name: Validate Frontend Dockerfile
        run: docker build -f src/frontend/Dockerfile src/frontend --target build
